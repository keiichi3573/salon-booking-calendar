<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>COMFORT ホーム</title>

  <style>

    *{
      box-sizing:border-box;
    }

    body{
      margin:0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans JP",
        sans-serif;

      background:#f7f3ef;
      color:#4c403a;
    }

    .homePage{
      min-height:100vh;
    }

    /* =========================
       ヘッダー
    ========================= */

    .homeHeader{
      height:72px;
      display:flex;
      align-items:center;
      justify-content:center;

      background:#ffffff;
      border-bottom:1px solid #e8e0da;

      padding:10px 20px;
    }

    .homeLogo{
      max-height:45px;
      max-width:200px;
      object-fit:contain;
    }

    /* =========================
       全体
    ========================= */

    .homeWrap{
      width:min(1000px, 100%);
      margin:0 auto;
      padding:34px 24px 50px;
    }

    .homeIntro{
      text-align:center;
      margin-bottom:30px;
    }

    .homeEnglish{
      font-size:12px;
      letter-spacing:.18em;
      color:#a8867e;
      font-weight:700;
      margin-bottom:8px;
    }

    .homeTitle{
      margin:0;
      font-size:26px;
      font-weight:700;
      letter-spacing:.04em;
    }

    .homeSub{
      margin-top:8px;
      font-size:14px;
      color:#84736b;
    }

    /* =========================
       メイン機能
    ========================= */

    .mainSection{
      margin-bottom:30px;
    }

    .sectionTitle{
      font-size:14px;
      font-weight:700;
      margin-bottom:12px;
      color:#6d5b53;
    }

    .mainGrid{
      display:grid;
      grid-template-columns:
        repeat(3, minmax(0, 1fr));
      gap:14px;
    }

    .mainCard{
      display:flex;
      flex-direction:column;
      justify-content:center;

      min-height:145px;
      padding:22px;

      text-decoration:none;
      color:#443832;

      background:#ffffff;

      border:
        1px solid #eaded8;

      border-radius:18px;

      box-shadow:
        0 4px 16px rgba(90,70,60,.06);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }

    .mainCard:hover{
      transform:translateY(-2px);

      box-shadow:
        0 7px 20px rgba(90,70,60,.10);
    }

    .mainCardPrimary{
      background:#fff8f7;
      border-color:#e8cbc6;
    }

    .cardIcon{
      font-size:28px;
      margin-bottom:12px;
    }

    .cardTitle{
      font-size:18px;
      font-weight:700;
      margin-bottom:7px;
    }

    .cardText{
      font-size:13px;
      line-height:1.6;
      color:#84736b;
    }

    /* =========================
       その他の機能
    ========================= */

    .subGrid{
      display:grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap:12px;
    }

    .subCard{
      display:flex;
      align-items:center;
      gap:14px;

      min-height:85px;

      padding:17px 20px;

      text-decoration:none;
      color:#443832;

      background:#ffffff;

      border:
        1px solid #eaded8;

      border-radius:15px;
    }

    .subIcon{
      font-size:23px;
      flex:none;
    }

    .subTitle{
      font-size:16px;
      font-weight:700;
    }

    .subText{
      margin-top:3px;

      font-size:12px;
      color:#8b7970;
    }

    /* =========================
       補足
    ========================= */

    .homeNote{
      margin-top:30px;

      padding:15px 18px;

      border-radius:14px;

      background:#f1ebe6;

      font-size:13px;
      line-height:1.7;
      color:#74645d;
    }

    /* =========================
       タブレット
    ========================= */

    @media(max-width:800px){

      .mainGrid{
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .mainCardPrimary{
        grid-column:1 / -1;
      }

    }

    /* =========================
       スマホ
    ========================= */

    @media(max-width:560px){

      .homeHeader{
        height:62px;
      }

      .homeLogo{
        max-height:38px;
      }

      .homeWrap{
        padding:
          24px 14px 38px;
      }

      .homeTitle{
        font-size:22px;
      }

      .homeSub{
        font-size:13px;
      }

      .mainGrid{
        grid-template-columns:1fr;
      }

      .mainCardPrimary{
        grid-column:auto;
      }

      .mainCard{
        min-height:115px;
        padding:18px;
      }

      .subGrid{
        grid-template-columns:1fr;
      }

    }

  </style>

</head>

<body>

<div class="homePage">

  <!-- ヘッダー -->
  <header class="homeHeader">

    <img
      src="logo.png"
      alt="Hair & Make COMFORT"
      class="homeLogo"
    >

  </header>


  <main class="homeWrap">

    <!-- タイトル -->
    <section class="homeIntro">

      <div class="homeEnglish">
        COMFORT MANAGEMENT
      </div>

      <h1 class="homeTitle">
        COMFORT ホーム
      </h1>

      <div class="homeSub">
        使用する機能を選択してください
      </div>

    </section>


    <!-- よく使う機能 -->
    <section class="mainSection">

      <div class="sectionTitle">
        よく使う機能
      </div>

      <div class="mainGrid">

        <!-- 今日の予約表 -->
        <a
          href="schedule.html"
          class="mainCard mainCardPrimary"
        >

          <div class="cardIcon">
            📋
          </div>

          <div class="cardTitle">
            今日の予約表
          </div>

          <div class="cardText">
            本日の予約確認・予約登録・変更・清算
          </div>

        </a>


        <!-- カレンダー -->
        <a
          href="index.html"
          class="mainCard"
        >

          <div class="cardIcon">
            📅
          </div>

          <div class="cardTitle">
            カレンダー
          </div>

          <div class="cardText">
            月間予約数・売上入力・月の状況を確認
          </div>

        </a>


        <!-- 顧客管理 -->
        <a
          href="customers.html"
          class="mainCard"
        >

          <div class="cardIcon">
            👤
          </div>

          <div class="cardTitle">
            顧客管理
          </div>

          <div class="cardText">
            お客様検索・来店履歴・顧客情報を確認
          </div>

        </a>

      </div>

    </section>


    <!-- その他 -->
    <section>

      <div class="sectionTitle">
        その他の機能
      </div>

      <div class="subGrid">

        <!-- 売上分析 -->
        <a
          href="analysis.html"
          class="subCard"
        >

          <div class="subIcon">
            📊
          </div>

          <div>

            <div class="subTitle">
              売上分析
            </div>

            <div class="subText">
              売上・客数・前年比などを確認
            </div>

          </div>

        </a>


        <!-- ネット予約 -->
        <a
  href="reserve.html?staff=1"
  class="subCard"
>

          <div class="subIcon">
            🌐
          </div>

          <div>

            <div class="subTitle">
              ネット予約画面
            </div>

            <div class="subText">
              お客様から見える予約画面を確認
            </div>

          </div>

        </a>

      </div>

    </section>


    <div class="homeNote">

      店舗で日常的に使用する
      「今日の予約表」を一番上に配置しています。
      カレンダーや売上分析は、
      必要なときにこの画面から開けます。

    </div>

  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>

  const homeSupabase =
    window.supabase.createClient(
      window.APP_CONFIG.SUPABASE_URL,
      window.APP_CONFIG.SUPABASE_ANON_KEY
    );

  async function checkHomeLogin(){

    const { data, error } =
      await homeSupabase.auth.getSession();

    if(error){
      console.error(error);
      window.location.href = "index.html";
      return;
    }

    if(!data?.session){
      window.location.href = "index.html";
      return;
    }

  }

  checkHomeLogin();

</script>  

</body>

</html>
