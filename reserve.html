<script>
  const SUPABASE_URL =
  window.APP_CONFIG
    ?.SUPABASE_URL;

const SUPABASE_ANON_KEY =
  window.APP_CONFIG
    ?.SUPABASE_ANON_KEY;

if(
  !SUPABASE_URL ||
  !SUPABASE_ANON_KEY
){
  throw new Error(
    "Supabase設定が読み込めていません。config.jsを確認してください。"
  );
}

const sb =
  window.supabase
    .createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
  
  let selectedStaff = "";

  function showStaffStep() {
    const staffStep = document.getElementById("staffStep");

    staffStep.hidden = false;

      behavior: "smooth",
      block: "start"
    });

  function showMenuStep() {

    document.getElementById("menuStep");

  menuStep.hidden = false;

  menuStep.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

  function selectStaff(button) {
    document
      .querySelectorAll(".staff-button")
      .forEach(btn => {
        btn.classList.remove("selected");
      });

    button.classList.add("selected");

    selectedStaff = button.dataset.staff;

    document.getElementById("selectedStaffName").textContent =
      selectedStaff;

    document.getElementById("selectedStaffArea").hidden = false;

    document.getElementById("menuStep").hidden = false;

document.getElementById("menuStep").scrollIntoView({
  behavior: "smooth",
  block: "start"
});
  }

let selectedMenu = "";
let selectedMenuMinutes = 0;

function selectMenu(button) {
  document
    .querySelectorAll(".menu-button")
    .forEach(btn => {
      btn.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedMenu = button.dataset.menu;
  selectedMenuMinutes = Number(button.dataset.minutes);

  document.getElementById("selectedMenuName").textContent =
    selectedMenu;

  document.getElementById("selectedMenuArea").hidden = false;

document.getElementById("dateStep").hidden = false;

document.getElementById("dateStep").scrollIntoView({
  behavior: "smooth",
  block: "start"
});
  
}

  let selectedDate = "";

  function setMinimumReservationDate() {
  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  const todayString = `${year}-${month}-${day}`;

  document.getElementById("reservationDate").min = todayString;
}

function isSalonClosed(date) {
  const day = date.getDay();

  // 毎週月曜日
  if (day === 1) {
    return true;
  }

  // 火曜日だけ追加判定
  if (day === 2) {
    const previousDay = new Date(date);
    previousDay.setDate(date.getDate() - 1);

    const previousMondayDate = previousDay.getDate();

    // 第1月曜日の翌日
    if (previousMondayDate >= 1 && previousMondayDate <= 7) {
      return true;
    }

    // 第3月曜日の翌日
    if (previousMondayDate >= 15 && previousMondayDate <= 21) {
      return true;
    }
  }

  return false;
}

function selectDate(value) {
  selectedDate = value;

  if (!selectedDate) {
    document.getElementById("selectedDateArea").hidden = true;
    return;
  }

  const date = new Date(selectedDate + "T00:00:00");

  if (isSalonClosed(date)) {
    alert("選択された日は定休日です。別の日を選択してください。");

    document.getElementById("reservationDate").value = "";
    selectedDate = "";
    document.getElementById("selectedDateArea").hidden = true;

    return;
  }

  const formattedDate =
    `${date.getFullYear()}年` +
    `${date.getMonth() + 1}月` +
    `${date.getDate()}日`;

  document.getElementById("selectedDateText").textContent =
    formattedDate;

  document.getElementById("selectedDateArea").hidden = false;

renderAvailableTimeOptions();

document.getElementById("timeStep").hidden = false;

document.getElementById("timeStep").scrollIntoView({
  behavior: "smooth",
  block: "start"
});
  
}

  let selectedTime = "";
let selectedAssignedStaffId = "";

function timeToMinutes(time) {
  const [hour, minute] =
    String(time)
      .slice(0, 5)
      .split(":")
      .map(Number);

  return hour * 60 + minute;
}

function minutesToTime(minutes) {
  const hour =
    Math.floor(minutes / 60);

  const minute =
    minutes % 60;

  return (
    `${String(hour).padStart(2, "0")}:` +
    `${String(minute).padStart(2, "0")}`
  );
}

async function renderAvailableTimeOptions() {
  const container =
    document.getElementById("timeOptions");

  container.innerHTML =
    "空き時間を確認しています…";

  let bookedData = [];

if (selectedStaff === "指名なし") {
  const [
    kitamuraResult,
    yamazakiResult
  ] = await Promise.all([
    sb.rpc(
      "get_public_appointment_slots",
      {
        p_date: selectedDate,
        p_staff_id: "kitamura"
      }
    ),
    sb.rpc(
      "get_public_appointment_slots",
      {
        p_date: selectedDate,
        p_staff_id: "yamazaki"
      }
    )
  ]);

  if (
    kitamuraResult.error ||

  ) {
    console.error(
      "空き時間取得エラー:",
      kitamuraResult.error ||
      yamazakiResult.error
    );

    container.innerHTML =
      "空き時間を取得できませんでした。";

    return;
  }

  bookedData = {
    kitamura:
      kitamuraResult.data || [],
    yamazaki:
      yamazakiResult.data || []
  };

} else {
  const staffId =
    selectedStaff === "北村 美穂"
      ? "kitamura"
      : "yamazaki";

  const {
    data,
    error
  } = await sb.rpc(
    "get_public_appointment_slots",
    {
      p_date: selectedDate,
      p_staff_id: staffId
    }
  );

  if (error) {
    console.error(
      "空き時間取得エラー:",
      error
    );

    container.innerHTML =
      "空き時間を取得できませんでした。";

    return;
  }

  bookedData = data || [];
}

let bookedSlots = [];
if (selectedStaff === "指名なし") {
  bookedSlots = {
    kitamura:
      bookedData.kitamura.map(row => ({
        start:
          timeToMinutes(row.start_time),
        end:
          timeToMinutes(row.end_time)
      })),

    yamazaki:
      bookedData.yamazaki.map(row => ({
        start:
          timeToMinutes(row.start_time),
        end:
          timeToMinutes(row.end_time)
      }))
  };

} else {
  bookedSlots =
    bookedData.map(row => ({
      start:
        timeToMinutes(row.start_time),
      end:
        timeToMinutes(row.end_time)
    }));
}

  container.innerHTML = "";

  const startMinutes =
  9 * 60 + 30;

const colorPermMenus = [
  "カラー",
  "パーマ",
  "カット＋カラー",
  "カット＋パーマ",
  "カット＋カラー＋ベーシックT",
  "カット＋パーマ＋ベーシックT",
  "カラー＋トリートメント"
];

const lastStartMinutes =
  colorPermMenus.includes(selectedMenu)
    ? 17 * 60
    : 18 * 60;

const displayEndMinutes =
  21 * 60 + 30;

  for (
    let minutes = startMinutes;
    minutes <= lastStartMinutes;
    minutes += 15
  ) {
    const candidateEnd =
      minutes + selectedMenuMinutes;

    if (candidateEnd > displayEndMinutes) {
  continue;
}

    let availableStaffId = "";

if (selectedStaff === "指名なし") {
  const kitamuraOverlap =
    bookedSlots.kitamura.some(slot =>
      minutes < slot.end &&
      candidateEnd > slot.start
    );

  const yamazakiOverlap =
    bookedSlots.yamazaki.some(slot =>
      minutes < slot.end &&
      candidateEnd > slot.start
    );

  if (
    kitamuraOverlap &&
    yamazakiOverlap
  ) {
    continue;
  }

  if (
    !kitamuraOverlap &&
    yamazakiOverlap
  ) {
    availableStaffId = "kitamura";

  } else if (
    kitamuraOverlap &&
    !yamazakiOverlap
  ) {
    availableStaffId = "yamazaki";

  } else {
    availableStaffId =
      bookedData.kitamura.length <=
      bookedData.yamazaki.length
        ? "kitamura"
        : "yamazaki";
  }

} else {
  const overlap =
    bookedSlots.some(slot =>
      minutes < slot.end &&
      candidateEnd > slot.start
    );

  if (overlap) {
    continue;
  }

  availableStaffId =
    selectedStaff === "北村 美穂"
      ? "kitamura"
      : "yamazaki";
}

    const button =
      document.createElement("button");

    const time =
      minutesToTime(minutes);

    button.type = "button";
    button.className = "time-button";
    button.textContent = time;
    button.dataset.staffId =
  availableStaffId;

    button.onclick = () => {
      selectTime(button, time);
    };

    container.appendChild(button);
  }

  if (!container.children.length) {
    container.innerHTML =
      "この日は予約できる時間がありません。";
  }
}

function selectTime(button, time) {
  document
    .querySelectorAll(".time-button")
    .forEach(btn => {
      btn.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedTime = time;

  selectedAssignedStaffId =
    button.dataset.staffId || "";

  document.getElementById("selectedTimeText").textContent =
    selectedTime;

  document.getElementById("selectedTimeArea").hidden = false;
  document.getElementById("nameStep").hidden = false;

document.getElementById("nameStep").scrollIntoView({
  behavior: "smooth",
  block: "start"
});
}

function showConfirmStep() {
  const customerName =
    document
      .getElementById("customerName")
      .value
      .trim();

  if (!customerName) {
    alert("お名前を入力してください。");
    document.getElementById("customerName").focus();
    return;
  }

  let staffLabel = selectedStaff;

  if (
    selectedStaff === "指名なし" &&
    selectedAssignedStaffId
  ) {
    staffLabel = "指名なし";
  }

  document.getElementById("confirmStaff").textContent =
    staffLabel;

  document.getElementById("confirmMenu").textContent =
    selectedMenu;

  document.getElementById("confirmDate").textContent =
    document.getElementById("selectedDateText").textContent;

  document.getElementById("confirmTime").textContent =
    selectedTime;

  document.getElementById("confirmName").textContent =
    customerName;

  document.getElementById("confirmStep").hidden = false;

  document.getElementById("confirmStep").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}

async function savePublicBooking() {
  const button =
    document.getElementById(
      "savePublicBookingButton"
    );

  const customerName =
    document
      .getElementById("customerName")
      .value
      .trim();

  if (!customerName) {
    alert("お名前を入力してください。");
    return;
  }

  if (
    !selectedDate ||
    !selectedTime ||
    !selectedMenu ||
    !selectedAssignedStaffId
  ) {
    alert(
      "予約内容を確認できませんでした。最初から選択し直してください。"
    );
    return;
  }

  const startMinutes =
    timeToMinutes(selectedTime);

  const endMinutes =
    startMinutes +
    selectedMenuMinutes;

  const endTime =
    minutesToTime(endMinutes);

  const nomination =
    selectedStaff === "指名なし"
      ? "free"
      : "nomination";

  button.disabled = true;
  button.textContent = "予約しています…";

  try {
    const {
      data,
      error
    } = await sb.rpc(
      "create_public_appointment",
      {
        p_date:
          selectedDate,

        p_staff_id:
          selectedAssignedStaffId,

        p_customer_name:
          customerName,

        p_start_time:
          selectedTime,

        p_end_time:
          endTime,

        p_menu_label:
          selectedMenu,

        p_nomination:
          nomination
      }
    );

    if (error) {
      throw error;
    }

    console.log(
      "予約完了:",
      data
    );

    button.textContent =
      "予約が完了しました";

    alert(
      "ご予約を承りました。\nありがとうございます。"
    );

  } catch (error) {
    console.error(
      "予約保存エラー:",
      error
    );

    button.disabled = false;
    button.textContent =
      "この内容で予約する";

    if (
      String(error.message)
        .includes(
          "time slot is already booked"
        )
    ) {
      alert(
        "申し訳ありません。この時間は先ほど予約が入りました。\n別の時間を選択してください。"
      );

      await renderAvailableTimeOptions();

      return;
    }

    alert(
      "予約を保存できませんでした。\n時間をおいてもう一度お試しください。"
    );
  }
}  

document.addEventListener("DOMContentLoaded", () => {
  setMinimumReservationDate();
});
</script>
