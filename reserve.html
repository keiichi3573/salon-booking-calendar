<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ご予約 | Hair & Make COMFORT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f8f4ef;
      color: #4f4039;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .shop-logo {
  display: block;
  width: min(320px, 80%);
  height: auto;
  margin: 0 auto;
}

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(90, 70, 60, 0.08);
    }

    .title {
      margin: 0 0 8px;
      text-align: center;
      font-size: 22px;
      color: #6f5548;
    }

    .description {
      margin: 0 0 24px;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
      color: #7d6a61;
    }

    .step-list {
      display: grid;
      gap: 12px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid #eadfd8;
      border-radius: 14px;
      background: #fffaf7;
    }

    .step-number {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #d8b5a6;
      color: #fff;
      font-weight: 700;
    }

    .step-text {
      font-size: 15px;
      font-weight: 600;
    }

    .notice {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f4ede8;
      font-size: 13px;
      line-height: 1.7;
      color: #75635a;
    }

    .start-button {
      width: 100%;
      margin-top: 24px;
      padding: 17px 20px;
      border: none;
      border-radius: 14px;
      background: #b9857f;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .start-button:active {
      transform: scale(0.99);
    }

    .staff-step {
  margin-top: 28px;
}

.step-title {
  margin: 0 0 18px;
  text-align: center;
  font-size: 18px;
  color: #6f5548;
}

.staff-options {
  display: grid;
  gap: 12px;
}

.staff-button {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #dfc7bd;
  border-radius: 14px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.staff-button:active {
  transform: scale(0.99);
}

.staff-button.free {
  background: #f4ede8;
}

.staff-button.selected {
  background: #b9857f;
  border-color: #b9857f;
  color: #fff;
}

.selected-staff-area {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #f4ede8;
  text-align: center;
  font-size: 14px;
  color: #6f5548;
}

    .menu-step {
  margin-top: 32px;
}

.menu-options {
  display: grid;
  gap: 12px;
}

.menu-button {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #dfc7bd;
  border-radius: 14px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.menu-button:active {
  transform: scale(0.99);
}

.menu-button.selected {
  background: #b9857f;
  border-color: #b9857f;
  color: #fff;
}

.selected-menu-area {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #f4ede8;
  text-align: center;
  font-size: 14px;
  color: #6f5548;
}

    .date-step {
  margin-top: 32px;
}

.date-input {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #dfc7bd;
  border-radius: 14px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 16px;
}

.selected-date-area {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #f4ede8;
  text-align: center;
  font-size: 14px;
  color: #6f5548;
}

    .time-step {
  margin-top: 32px;
}

.time-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.time-button {
  width: 100%;
  padding: 14px 8px;
  border: 1px solid #dfc7bd;
  border-radius: 12px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.time-button.selected {
  background: #b9857f;
  border-color: #b9857f;
  color: #fff;
}

.selected-time-area {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #f4ede8;
  text-align: center;
  font-size: 14px;
  color: #6f5548;
}
    
    @media (min-width: 700px) {
      .page {
        padding-top: 48px;
      }

      .card {
        padding: 34px 36px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="header">
  <img
    src="logo.png"
    alt="Hair & Make COMFORT"
    class="shop-logo"
  >
</header>

    <section class="card">

      <h2 class="title">ご予約</h2>

      <p class="description">
        画面の案内に沿って<br>
        ご希望の内容を選択してください。
      </p>

      <div class="step-list">

        <div class="step">
          <div class="step-number">1</div>
          <div class="step-text">スタッフを選択</div>
        </div>

        <div class="step">
          <div class="step-number">2</div>
          <div class="step-text">メニューを選択</div>
        </div>

        <div class="step">
          <div class="step-number">3</div>
          <div class="step-text">日付を選択</div>
        </div>

        <div class="step">
          <div class="step-number">4</div>
          <div class="step-text">空いている時間を選択</div>
        </div>

        <div class="step">
          <div class="step-number">5</div>
          <div class="step-text">お名前を入力</div>
        </div>

        <div class="step">
          <div class="step-number">6</div>
          <div class="step-text">予約内容を確認</div>
        </div>

      </div>

      <div class="notice">
        ※ 現在は予約ページを準備中です。<br>
        この画面は動作確認用です。
      </div>

      <button
  class="start-button"
  type="button"
  onclick="showStaffStep()"
>
  予約を始める
</button>

<section id="staffStep" class="staff-step" hidden>
  <h3 class="step-title">担当スタッフを選択してください</h3>

  <div class="staff-options">

  <button
    class="staff-button"
    type="button"
    data-staff="北村 美穂"
    onclick="selectStaff(this)"
  >
    北村 美穂
  </button>

  <button
    class="staff-button"
    type="button"
    data-staff="山崎 錦子"
    onclick="selectStaff(this)"
  >
    山崎 錦子
  </button>

  <button
    class="staff-button free"
    type="button"
    data-staff="指名なし"
    onclick="selectStaff(this)"
  >
    指名なし
  </button>

</div>

<div id="selectedStaffArea" class="selected-staff-area" hidden>
  選択中：
  <strong id="selectedStaffName"></strong>
</div>

<section id="menuStep" class="menu-step" hidden>
  <h3 class="step-title">メニューを選択してください</h3>

  <div class="menu-options">

  <button
    class="menu-button"
    type="button"
    data-menu="カット"
    data-minutes="75"
    onclick="selectMenu(this)"
  >
    カット
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="カラー"
    data-minutes="105"
    onclick="selectMenu(this)"
  >
    カラー
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="パーマ"
    data-minutes="150"
    onclick="selectMenu(this)"
  >
    パーマ
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="カット＋カラー"
    data-minutes="150"
    onclick="selectMenu(this)"
  >
    カット＋カラー
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="カット＋パーマ"
    data-minutes="150"
    onclick="selectMenu(this)"
  >
    カット＋パーマ
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="カット＋カラー＋ベーシックT"
    data-minutes="165"
    onclick="selectMenu(this)"
  >
    カット＋カラー＋ベーシックT
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="カット＋パーマ＋ベーシックT"
    data-minutes="165"
    onclick="selectMenu(this)"
  >
    カット＋パーマ＋ベーシックT
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="カラー＋トリートメント"
    data-minutes="135"
    onclick="selectMenu(this)"
  >
    カラー＋トリートメント
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="ヘッドスパ"
    data-minutes="15"
    onclick="selectMenu(this)"
  >
    ヘッドスパ
  </button>

  <button
    class="menu-button"

    data-menu="ベーシックT"
    data-minutes="15"

  >
    ベーシックT
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="プラセンタT"

  >

  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="ツヤ恋T"
    data-minutes="45"
    onclick="selectMenu(this)"
  >
    ツヤ恋T
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="炭酸シャンプー"
    data-minutes="15"
    onclick="selectMenu(this)"
  >
    炭酸シャンプー
  </button>

  <button
    class="menu-button"
    type="button"
    data-menu="縮毛矯正"
    data-minutes="195"
    onclick="selectMenu(this)"
  >
    縮毛矯正
  </button>

</div>
  <div id="selectedMenuArea" class="selected-menu-area" hidden>
    選択中：
    <strong id="selectedMenuName"></strong>
  </div>

<section id="dateStep" class="date-step" hidden>
  <h3 class="step-title">日付を選択してください</h3>

  <input
    id="reservationDate"
    class="date-input"
    type="date"
    onchange="selectDate(this.value)"
  >

  <div id="selectedDateArea" class="selected-date-area" hidden>
    選択中：
    <strong id="selectedDateText"></strong>
  </div>

<section id="timeStep" class="time-step" hidden>
  <h3 class="step-title">時間を選択してください</h3>

  <div id="timeOptions" class="time-options">
    <!-- 空き時間をJavaScriptで表示 -->
  </div>

  <div id="selectedTimeArea" class="selected-time-area" hidden>
    選択中：
    <strong id="selectedTimeText"></strong>
  </div>
</section>
  
</section>
  
</section>
  
</section>

    </section>

  </main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
  
<script>
  const SUPABASE_URL =
  window.APP_CONFIG
    ?.SUPABASE_URL;

const SUPABASE_ANON_KEY =
  window.APP_CONFIG
    ?.SUPABASE_ANON_KEY;

if(
  !SUPABASE_URL ||
  !SUPABASE_ANON_KEY
){
  throw new Error(
    "Supabase設定が読み込めていません。config.jsを確認してください。"
  );
}

const sb =
  window.supabase
    .createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
  let selectedStaff = "";

  function showStaffStep() {
    const staffStep = document.getElementById("staffStep");

    staffStep.hidden = false;

    staffStep.scrollIntoView({
      behavior: "smooth",
      block: "start"
    });
  }

  function selectStaff(button) {
    document
      .querySelectorAll(".staff-button")
      .forEach(btn => {
        btn.classList.remove("selected");
      });

    button.classList.add("selected");

    selectedStaff = button.dataset.staff;

    document.getElementById("selectedStaffName").textContent =
      selectedStaff;

    document.getElementById("selectedStaffArea").hidden = false;

    document.getElementById("menuStep").hidden = false;

document.getElementById("menuStep").scrollIntoView({
  behavior: "smooth",
  block: "start"
});
  }

let selectedMenu = "";
let selectedMenuMinutes = 0;

function selectMenu(button) {
  document
    .querySelectorAll(".menu-button")
    .forEach(btn => {
      btn.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedMenu = button.dataset.menu;
  selectedMenuMinutes = Number(button.dataset.minutes);

  document.getElementById("selectedMenuName").textContent =
    selectedMenu;

  document.getElementById("selectedMenuArea").hidden = false;

document.getElementById("dateStep").hidden = false;

document.getElementById("dateStep").scrollIntoView({
  behavior: "smooth",
  block: "start"
});
  
}

  let selectedDate = "";

  function setMinimumReservationDate() {
  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  const todayString = `${year}-${month}-${day}`;

  document.getElementById("reservationDate").min = todayString;
}

function isSalonClosed(date) {
  const day = date.getDay();

  // 毎週月曜日
  if (day === 1) {
    return true;
  }

  // 火曜日だけ追加判定
  if (day === 2) {
    const previousDay = new Date(date);
    previousDay.setDate(date.getDate() - 1);

    const previousMondayDate = previousDay.getDate();

    // 第1月曜日の翌日
    if (previousMondayDate >= 1 && previousMondayDate <= 7) {
      return true;
    }

    // 第3月曜日の翌日
    if (previousMondayDate >= 15 && previousMondayDate <= 21) {
      return true;
    }
  }

  return false;
}

function selectDate(value) {
  selectedDate = value;

  if (!selectedDate) {
    document.getElementById("selectedDateArea").hidden = true;
    return;
  }

  const date = new Date(selectedDate + "T00:00:00");

  if (isSalonClosed(date)) {
    alert("選択された日は定休日です。別の日を選択してください。");

    document.getElementById("reservationDate").value = "";
    selectedDate = "";
    document.getElementById("selectedDateArea").hidden = true;

    return;
  }

  const formattedDate =
    `${date.getFullYear()}年` +
    `${date.getMonth() + 1}月` +
    `${date.getDate()}日`;

  document.getElementById("selectedDateText").textContent =
    formattedDate;

  document.getElementById("selectedDateArea").hidden = false;

renderTemporaryTimeOptions();

document.getElementById("timeStep").hidden = false;

document.getElementById("timeStep").scrollIntoView({
  behavior: "smooth",
  block: "start"
});
  
}

  let selectedTime = "";

function renderTemporaryTimeOptions() {
  const container = document.getElementById("timeOptions");

  container.innerHTML = "";

  const times = [
    "09:30",
    "10:00",
    "10:30",
    "11:00",
    "11:30",
    "12:00",
    "12:30",
    "13:00",
    "13:30",
    "14:00",
    "14:30",
    "15:00",
    "15:30",
    "16:00",
    "16:30",
    "17:00",
    "17:30",
    "18:00"
  ];

  times.forEach(time => {
    const button = document.createElement("button");

    button.type = "button";
    button.className = "time-button";
    button.textContent = time;

    button.onclick = () => {
      selectTime(button, time);
    };

    container.appendChild(button);
  });
}

function selectTime(button, time) {
  document
    .querySelectorAll(".time-button")
    .forEach(btn => {
      btn.classList.remove("selected");
    });

  button.classList.add("selected");

  selectedTime = time;

  document.getElementById("selectedTimeText").textContent =
    selectedTime;

  document.getElementById("selectedTimeArea").hidden = false;
}

document.addEventListener("DOMContentLoaded", () => {
  setMinimumReservationDate();
});  
</script>
  
</body>
</html>
