<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ご予約 | Hair & Make COMFORT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;
      background: #f8f4ef;
      color: #4f4039;
    }

    .page {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 48px;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .shop-logo {
  display: block;
  width: min(190px, 55%);
  height: auto;
  margin: 0 auto;
}

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(90, 70, 60, 0.08);
    }

    .title {
      margin: 0 0 8px;
      text-align: center;
      font-size: 22px;
      color: #6f5548;
    }

    .description {
      margin: 0 0 24px;
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
      color: #7d6a61;
    }

    .tutorial-flow {
  display: grid;
  gap: 5px;
  margin-top: 16px;
}

.tutorial-mini {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 10px 14px;

  border: 1px solid #eadfd8;
  border-radius: 13px;

  background:
    linear-gradient(
      135deg,
      #fffdfb 0%,
      #faf4f0 100%
    );
}

.tutorial-mini .tutorial-icon {
  width: 34px;
  height: 34px;
  flex: 0 0 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;

  background: #f1ded6;

  font-size: 17px;
}

.tutorial-mini-text {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.tutorial-mini-text strong {
  color: #5f4a41;
  font-size: 14px;
}

.tutorial-mini-text span {
  color: #8a756a;
  font-size: 12px;
}

.tutorial-arrow {
  height: 15px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #c49b8d;

  font-size: 18px;
  font-weight: 700;
  line-height: 1;
}

.tutorial-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-top: 16px;
}

.tutorial-column {
  display: flex;
  flex-direction: column;
  align-items: stretch;
}

.tutorial-down {
  height: 26px;

  display: flex;
  align-items: center;
  justify-content: center;

  color: #a96f67;

  font-size: 24px;
  font-weight: 900;
  line-height: 1;
}

.tutorial-step-note {
  margin-top: 12px;
  padding: 9px 12px;

  border-radius: 10px;

  background: #fbf6f2;

  color: #8a756a;

  font-size: 11px;
  line-height: 1.6;
  text-align: center;
}    
    
.tutorial-small {
  position: relative;

  display: flex;
  align-items: center;
  gap: 8px;

  min-height: 54px;
  padding: 9px 12px;

  border: 1px solid #eadfd8;
  border-radius: 12px;

  background: #fffaf7;
}

.tutorial-small-icon {
  width: 30px;
  height: 30px;
  flex: 0 0 30px;

  display: flex;
  align-items: center;
  justify-content: center;

  border-radius: 50%;
  background: #f1ded6;

  font-size: 15px;
}

.tutorial-small-text {
  min-width: 0;
}

.tutorial-small-text strong {
  display: block;
  margin-bottom: 2px;

  color: #b9857f;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
}

.tutorial-small-text span {
  display: block;

  color: #5f4a41;
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}

.tutorial-small-text small {
  display: block;
  margin-top: 2px;

  color: #b9857f;
  font-size: 9px;
  font-weight: 700;
}
    
/* STEP2 → STEP3、STEP4 → STEP5 は下向きにする */
    
.tutorial-last {
  background: #f7efeb;
}
    
.tutorial-note {
  margin-top: 18px;
  padding: 12px 14px;

  border-radius: 12px;

  background: #f4ede8;
  color: #75635a;

  font-size: 12px;
  line-height: 1.6;
  text-align: center;
}

    .step-list {
      display: grid;
      gap: 12px;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px;
      border: 1px solid #eadfd8;
      border-radius: 14px;
      background: #fffaf7;
    }

    .step-number {
      width: 34px;
      height: 34px;
      flex: 0 0 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #d8b5a6;
      color: #fff;
      font-weight: 700;
    }

    .step-text {
      font-size: 15px;
      font-weight: 600;
    }

    .notice {
      margin-top: 22px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f4ede8;
      font-size: 13px;
      line-height: 1.7;
      color: #75635a;
    }

    .start-button {
  position: relative;

  width: 100%;
  margin-top: 24px;
  padding: 18px 24px;

  border: 1px solid rgba(161, 111, 102, 0.22);
  border-radius: 16px;

  background:
    linear-gradient(
      135deg,
      #bd8d86 0%,
      #a9746d 100%
    );

  color: #fff;

  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.06em;

  box-shadow:
    0 8px 18px rgba(135, 91, 82, 0.18),
    inset 0 1px 0 rgba(255, 255, 255, 0.28);

  cursor: pointer;

  transition:
    transform 0.18s ease,
    box-shadow 0.18s ease;
}

.start-button::after {
  content: "›";

  position: absolute;
  right: 20px;
  top: 50%;

  transform: translateY(-52%);

  font-size: 26px;
  font-weight: 300;
  line-height: 1;
}

.start-button:hover {
  transform: translateY(-1px);

  box-shadow:
    0 10px 22px rgba(135, 91, 82, 0.24),
    inset 0 1px 0 rgba(255, 255, 255, 0.30);
}

.start-button:active {
  transform: translateY(1px);
}

    .start-button:active {
      transform: scale(0.99);
    }

    .staff-step {
  margin-top: 28px;
}

.step-title {
  margin: 0 0 18px;
  text-align: center;
  font-size: 18px;
  color: #6f5548;
}

.staff-options {
  display: grid;
  gap: 12px;
}

.staff-button {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #dfc7bd;
  border-radius: 14px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.staff-button:active {
  transform: scale(0.99);
}

.staff-button.free {
  background: #f4ede8;
}

.staff-button.selected {
  background: #b9857f;
  border-color: #b9857f;
  color: #fff;
}

.selected-staff-area {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #f4ede8;
  font-size: 14px;
  color: #6f5548;

  display: flex;
align-items: center;
gap: 8px;
}

    .menu-step {
  margin-top: 32px;
}

.menu-options {
  display: grid;
  gap: 12px;
}

.menu-button {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #dfc7bd;
  border-radius: 14px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

.menu-button:active {
  transform: scale(0.99);
}

.menu-button.selected {
  background: #b9857f;
  border-color: #b9857f;
  color: #fff;
}

.selected-menu-area {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #f4ede8;
  text-align: center;
  font-size: 14px;
  color: #6f5548;

  display: flex;
align-items: center;
gap: 8px;
}

 .selected-check {
  color: #a9756d;
  font-weight: 800;
}

.change-selection-button {
  margin-left: auto;
  padding: 6px 11px;

  border: 1px solid #d9beb5;
  border-radius: 20px;

  background: #fff;
  color: #9b6d65;

  font-size: 12px;
  font-weight: 700;

  cursor: pointer;
}   

    .date-step {
  margin-top: 32px;
}

.date-input {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #dfc7bd;
  border-radius: 14px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 16px;
}

.selected-date-area {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #f4ede8;
  text-align: center;
  font-size: 14px;
  color: #6f5548;

  display: flex;
align-items: center;
gap: 8px;
}

    .time-step {
  margin-top: 32px;
}

.time-options {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

.time-button {
  width: 100%;
  padding: 14px 8px;
  border: 1px solid #dfc7bd;
  border-radius: 12px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

.time-button.selected {
  background: #b9857f;
  border-color: #b9857f;
  color: #fff;
}

.selected-time-area {
  margin-top: 18px;
  padding: 12px 16px;
  border-radius: 12px;
  background: #f4ede8;
  text-align: center;
  font-size: 14px;
  color: #6f5548;

  display: flex;
align-items: center;
gap: 8px;
}

    .name-step {
  margin-top: 32px;
}

.name-input {
  width: 100%;
  padding: 16px 18px;
  border: 1px solid #dfc7bd;
  border-radius: 14px;
  background: #fffaf7;
  color: #5f4a41;
  font-size: 16px;
}

.name-input:focus {
  outline: none;
  border-color: #b9857f;
}

.confirm-button {
  width: 100%;
  margin-top: 18px;
  padding: 17px 20px;
  border: none;
  border-radius: 14px;
  background: #b9857f;
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
}

.confirm-step {
  margin-top: 32px;
}

.confirm-card {
  padding: 18px;
  border: 1px solid #eadfd8;
  border-radius: 14px;
  background: #fffaf7;
}

.confirm-row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 12px 0;
  border-bottom: 1px solid #eadfd8;
}

.confirm-row:last-child {
  border-bottom: none;
}

.confirm-row span {
  color: #8a7469;
  font-size: 14px;
}

.confirm-row strong {
  text-align: right;
  color: #5f4a41;
}    

.confirm-button:active {
  transform: scale(0.99);
}

@media (max-width: 699px) {

  .page {
    padding-left: 10px;
    padding-right: 10px;
  }

  .card {
    padding: 20px 14px;
    border-radius: 16px;
  }

  .title {
    font-size: 20px;
  }

  .description {
    font-size: 12px;
    margin-bottom: 16px;
  }

  .tutorial-grid {
    column-gap: 6px;
    row-gap: 20px;
  }

  .tutorial-small {
    min-height: 50px;
    padding: 8px 9px;
    gap: 6px;
    border-radius: 11px;
  }

  .tutorial-small-icon {
    width: 28px;
    height: 28px;
    flex: 0 0 28px;
    font-size: 14px;
  }

  .tutorial-small-text strong {
    font-size: 9px;
    margin-bottom: 1px;
  }

  .tutorial-small-text span {
    font-size: 12px;
  }

  .tutorial-next {
    width: 22px;
    height: 22px;
    flex: 0 0 22px;
    font-size: 13px;
  }

  .tutorial-small:nth-child(2) .tutorial-next,
  .tutorial-small:nth-child(4) .tutorial-next {
    bottom: -17px;
  }

  .tutorial-note {
    margin-top: 16px;
    padding: 10px 8px;
    font-size: 11px;
  }

  .start-button {
    margin-top: 20px;
    padding: 16px 18px;
    font-size: 15px;
    border-radius: 14px;
  }

  .start-button::after {
    right: 16px;
    font-size: 23px;
  }
}
    
    @media (min-width: 700px) {
      .page {
        padding-top: 48px;
      }

      .card {
        padding: 34px 36px;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header class="header">
  <img
    src="logo.png"
    alt="Hair & Make COMFORT"
    class="shop-logo"
  >
</header>

    <section class="card">

      <h2 class="title">ご予約</h2>

<p class="description">
  かんたん6ステップでご予約いただけます
</p>

<div id="reservationTutorial" class="tutorial-grid">

  <div class="tutorial-column">

    <div class="tutorial-small">
      <div class="tutorial-small-icon">✂️</div>
      <div class="tutorial-small-text">
        <strong>STEP 1</strong>
        <span>メニュー</span>
      </div>
    </div>

    <div class="tutorial-down">↓</div>

    <div class="tutorial-small">
      <div class="tutorial-small-icon">👤</div>
      <div class="tutorial-small-text">
        <strong>STEP 2</strong>
        <span>スタッフ</span>
      </div>
    </div>

    <div class="tutorial-down">↓</div>

    <div class="tutorial-small">
  <div class="tutorial-small-icon">📅</div>
  <div class="tutorial-small-text">
    <strong>STEP 3</strong>
    <span>日付</span>
    <small>次は STEP 4</small>
  </div>
</div>

  </div>


  <div class="tutorial-column">

    <div class="tutorial-small">
      <div class="tutorial-small-icon">🕒</div>
      <div class="tutorial-small-text">
        <strong>STEP 4</strong>
        <span>時間</span>
      </div>
    </div>

    <div class="tutorial-down">↓</div>

    <div class="tutorial-small">
      <div class="tutorial-small-icon">✏️</div>
      <div class="tutorial-small-text">
        <strong>STEP 5</strong>
        <span>情報入力</span>
      </div>
    </div>

    <div class="tutorial-down">↓</div>

    <div class="tutorial-small tutorial-last">
      <div class="tutorial-small-icon">✓</div>
      <div class="tutorial-small-text">
        <strong>STEP 6</strong>
        <span>確認・予約</span>
      </div>
    </div>

  </div>

</div>

<div id="reservationTutorialNote" class="tutorial-note">
  空き時間は最新の予約状況から自動で表示されます。
</div>
      <button
  class="start-button"
  type="button"
  onclick="showMenuStep()"
>
  予約を始める
</button>

<section id="menuStep" class="menu-step" hidden>

  <h3 class="step-title">
    メニューを選択してください
  </h3>

  <div class="menu-options">

    <button
      class="menu-button"
      type="button"
      data-menu="カット"
      data-minutes="75"
      onclick="selectMenu(this)"
    >
      カット
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="カラー"
      data-minutes="105"
      onclick="selectMenu(this)"
    >
      カラー
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="パーマ"
      data-minutes="150"
      onclick="selectMenu(this)"
    >
      パーマ
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="カット＋カラー"
      data-minutes="150"
      onclick="selectMenu(this)"
    >
      カット＋カラー
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="カット＋パーマ"
      data-minutes="150"
      onclick="selectMenu(this)"
    >
      カット＋パーマ
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="カット＋カラー＋ベーシックT"
      data-minutes="165"
      onclick="selectMenu(this)"
    >
      カット＋カラー＋ベーシックT
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="カット＋パーマ＋ベーシックT"
      data-minutes="165"
      onclick="selectMenu(this)"
    >
      カット＋パーマ＋ベーシックT
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="カラー＋トリートメント"
      data-minutes="135"
      onclick="selectMenu(this)"
    >
      カラー＋トリートメント
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="ヘッドスパ"
      data-minutes="15"
      onclick="selectMenu(this)"
    >
      ヘッドスパ
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="ベーシックT"
      data-minutes="15"
      onclick="selectMenu(this)"
    >
      ベーシックT
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="プラセンタT"
      data-minutes="15"
      onclick="selectMenu(this)"
    >
      プラセンタT
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="ツヤ恋T"
      data-minutes="45"
      onclick="selectMenu(this)"
    >
      ツヤ恋T
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="炭酸シャンプー"
      data-minutes="15"
      onclick="selectMenu(this)"
    >
      炭酸シャンプー
    </button>

    <button
      class="menu-button"
      type="button"
      data-menu="縮毛矯正"
      data-minutes="195"
      onclick="selectMenu(this)"
    >
      縮毛矯正
    </button>

  </div>

  <div id="selectedMenuArea" class="selected-menu-area" hidden>
  <span class="selected-check">✓</span>

  <span>
    メニュー：
    <strong id="selectedMenuName"></strong>
  </span>

  <button
    class="change-selection-button"
    type="button"
    onclick="changeMenuSelection()"
  >
    変更
  </button>
</div>

</section>


<section id="staffStep" class="staff-step" hidden>

  <h3 class="step-title">
    担当スタッフを選択してください
  </h3>

  <div class="staff-options">

    <button
      class="staff-button free"
      type="button"
      data-staff="指名なし"
      onclick="selectStaff(this)"
    >
      指名なし
    </button>

    <button
      class="staff-button"
      type="button"
      data-staff="北村 美穂"
      onclick="selectStaff(this)"
    >
      北村 美穂
    </button>

    <button
      class="staff-button"
      type="button"
      data-staff="山崎 錦子"
      onclick="selectStaff(this)"
    >
      山崎 錦子
    </button>

  </div>

  <div id="selectedStaffArea" class="selected-staff-area" hidden>
  <span class="selected-check">✓</span>

  <span>
    スタッフ：
    <strong id="selectedStaffName"></strong>
  </span>

  <button
    class="change-selection-button"
    type="button"
    onclick="changeStaffSelection()"
  >
    変更
  </button>
</div>

</section>

<section id="dateStep" class="date-step" hidden>
  <h3 class="step-title">日付を選択してください</h3>

  <input
    id="reservationDate"
    class="date-input"
    type="date"
    onchange="selectDate(this.value)"
  >

  <div id="selectedDateArea" class="selected-date-area" hidden>
  <span class="selected-check">✓</span>

  <span>
    日付：
    <strong id="selectedDateText"></strong>
  </span>

  <button
    class="change-selection-button"
    type="button"
    onclick="changeDateSelection()"
  >
    変更
  </button>
</div>

<section id="timeStep" class="time-step" hidden>
  <h3 class="step-title">時間を選択してください</h3>

  <div id="timeOptions" class="time-options">
    <!-- 空き時間をJavaScriptで表示 -->
  </div>

  <div id="selectedTimeArea" class="selected-time-area" hidden>
  <span class="selected-check">✓</span>

  <span>
    時間：
    <strong id="selectedTimeText"></strong>
  </span>

  <button
    class="change-selection-button"
    type="button"
    onclick="changeTimeSelection()"
  >
    変更
  </button>
</div>

<section id="nameStep" class="name-step" hidden>
  <h3 class="step-title">お名前を入力してください</h3>

  <input
    id="customerName"
    class="name-input"
    type="text"
    placeholder="例：山田 花子"
    autocomplete="name"
  >

  <button
    id="confirmButton"
    class="confirm-button"
    type="button"
    onclick="showConfirmStep()"
  >
    予約内容を確認する
  </button>
</section>

<section id="confirmStep" class="confirm-step" hidden>
  <h3 class="step-title">予約内容をご確認ください</h3>

  function setMinimumReservationDate() {
  const today = new Date();

  const year = today.getFullYear();
  const month = String(today.getMonth() + 1).padStart(2, "0");
  const day = String(today.getDate()).padStart(2, "0");

  const todayString = `${year}-${month}-${day}`;

  document.getElementById("reservationDate").min = todayString;
}

function isSalonClosed(date) {
  const day = date.getDay();

  // 毎週月曜日
  if (day === 1) {
    return true;
  }

  // 火曜日だけ追加判定
  if (day === 2) {
    const previousDay = new Date(date);
    previousDay.setDate(date.getDate() - 1);

    const previousMondayDate = previousDay.getDate();

    // 第1月曜日の翌日
    if (previousMondayDate >= 1 && previousMondayDate <= 7) {
      return true;
    }

    // 第3月曜日の翌日
    if (previousMondayDate >= 15 && previousMondayDate <= 21) {
      return true;
    }
  }

  return false;
}

function timeToMinutes(time) {
  const [hour, minute] =
    String(time)
      .slice(0, 5)
      .split(":")
      .map(Number);

  return hour * 60 + minute;
}

function minutesToTime(minutes) {
  const hour =
    Math.floor(minutes / 60);

  const minute =
    minutes % 60;

  return (
    `${String(hour).padStart(2, "0")}:` +
    `${String(minute).padStart(2, "0")}`
  );
}

async function renderAvailableTimeOptions() {
  const container =
    document.getElementById("timeOptions");

  container.innerHTML =
    "空き時間を確認しています…";

  let bookedData = [];

if (selectedStaff === "指名なし") {
  const [
    kitamuraResult,
    yamazakiResult
  ] = await Promise.all([
    sb.rpc(
      "get_public_appointment_slots",
      {
        p_date: selectedDate,
        p_staff_id: "kitamura"
      }
    ),
    sb.rpc(
      "get_public_appointment_slots",
      {
        p_date: selectedDate,
        p_staff_id: "yamazaki"
      }
    )
  ]);

  if (
    kitamuraResult.error ||
    yamazakiResult.error
  ) {
    console.error(
      "空き時間取得エラー:",
      kitamuraResult.error ||
      yamazakiResult.error
    );

    container.innerHTML =
      "空き時間を取得できませんでした。";

    return;
  }

  bookedData = {
    kitamura:
      kitamuraResult.data || [],
    yamazaki:
      yamazakiResult.data || []
  };

} else {
  const staffId =
    selectedStaff === "北村 美穂"
      ? "kitamura"
      : "yamazaki";

  const {
    data,
    error
  } = await sb.rpc(
    "get_public_appointment_slots",
    {
      p_date: selectedDate,
      p_staff_id: staffId
    }
  );

  if (error) {
    console.error(
      "空き時間取得エラー:",
      error
    );

    container.innerHTML =
      "空き時間を取得できませんでした。";

    return;
  }

  bookedData = data || [];
}

let bookedSlots = [];
if (selectedStaff === "指名なし") {
  bookedSlots = {
    kitamura:
      bookedData.kitamura.map(row => ({
        start:
          timeToMinutes(row.start_time),
        end:
          timeToMinutes(row.end_time)
      })),

    yamazaki:
      bookedData.yamazaki.map(row => ({
        start:
          timeToMinutes(row.start_time),
        end:
          timeToMinutes(row.end_time)
      }))
  };

} else {
  bookedSlots =
    bookedData.map(row => ({
      start:
        timeToMinutes(row.start_time),
      end:
        timeToMinutes(row.end_time)
    }));
}

  container.innerHTML = "";

  const startMinutes =
  9 * 60 + 30;

const colorPermMenus = [
  "カラー",
  "パーマ",
  "カット＋カラー",
  "カット＋パーマ",
  "カット＋カラー＋ベーシックT",
  "カット＋パーマ＋ベーシックT",
  "カラー＋トリートメント"
];

const lastStartMinutes =
  colorPermMenus.includes(selectedMenu)
    ? 17 * 60
    : 18 * 60;

const displayEndMinutes =
  21 * 60 + 30;

  for (
    let minutes = startMinutes;
    minutes <= lastStartMinutes;
    minutes += 15
  ) {
    const candidateEnd =
      minutes + selectedMenuMinutes;

    if (candidateEnd > displayEndMinutes) {
  continue;
}

    let availableStaffId = "";

if (selectedStaff === "指名なし") {
  const kitamuraOverlap =
    bookedSlots.kitamura.some(slot =>
      minutes < slot.end &&
      candidateEnd > slot.start
    );

  const yamazakiOverlap =
    bookedSlots.yamazaki.some(slot =>
      minutes < slot.end &&
      candidateEnd > slot.start
    );

  if (
    kitamuraOverlap &&
    yamazakiOverlap
  ) {
    continue;
  }

  if (
    !kitamuraOverlap &&
    yamazakiOverlap
  ) {
    availableStaffId = "kitamura";

  } else if (
    kitamuraOverlap &&
    !yamazakiOverlap
  ) {
    availableStaffId = "yamazaki";

  } else {
    availableStaffId =
      bookedData.kitamura.length <=
      bookedData.yamazaki.length
        ? "kitamura"
        : "yamazaki";
  }

} else {
  const overlap =
    bookedSlots.some(slot =>
      minutes < slot.end &&
      candidateEnd > slot.start
    );

  if (overlap) {
    continue;
  }

  availableStaffId =
    selectedStaff === "北村 美穂"
      ? "kitamura"
      : "yamazaki";
}

    const button =
      document.createElement("button");

    const time =
      minutesToTime(minutes);

    button.type = "button";
    button.className = "time-button";
    button.textContent = time;
    button.dataset.staffId =
  availableStaffId;

    button.onclick = () => {
      selectTime(button, time);
    };

    container.appendChild(button);
  }

  if (!container.children.length) {
    container.innerHTML =
      "この日は予約できる時間がありません。";
  }
}

async function savePublicBooking() {
  const button =
    document.getElementById(
      "savePublicBookingButton"
    );

  const customerName =
    document
      .getElementById("customerName")
      .value
      .trim();

  if (!customerName) {
    alert("お名前を入力してください。");
    return;
  }

  if (
    !selectedDate ||
    !selectedTime ||
    !selectedMenu ||
    !selectedAssignedStaffId
  ) {
    alert(
      "予約内容を確認できませんでした。最初から選択し直してください。"
    );
    return;
  }

  const startMinutes =
    timeToMinutes(selectedTime);

  const endMinutes =
    startMinutes +
    selectedMenuMinutes;

  const endTime =
    minutesToTime(endMinutes);

  const nomination =
    selectedStaff === "指名なし"
      ? "free"
      : "nomination";

  button.disabled = true;
  button.textContent = "予約しています…";

  try {
    const {
      data,
      error
    } = await sb.rpc(
      "create_public_appointment",
      {
        p_date:
          selectedDate,

        p_staff_id:
          selectedAssignedStaffId,

        p_customer_name:
          customerName,

        p_start_time:
          selectedTime,

        p_end_time:
          endTime,

        p_menu_label:
          selectedMenu,

        p_nomination:
          nomination
      }
    );

    if (error) {
      throw error;
    }

    console.log(
      "予約完了:",
      data
    );

    button.textContent =
      "予約が完了しました";

    alert(
      "ご予約を承りました。\nありがとうございます。"
    );

  } catch (error) {
    console.error(
      "予約保存エラー:",
      error
    );

    button.disabled = false;
    button.textContent =
      "この内容で予約する";

    if (
      String(error.message)
        .includes(
          "time slot is already booked"
        )
    ) {
      alert(
        "申し訳ありません。この時間は先ほど予約が入りました。\n別の時間を選択してください。"
      );

      await renderAvailableTimeOptions();

      return;
    }

    alert(
      "予約を保存できませんでした。\n時間をおいてもう一度お試しください。"
    );
  }
}
