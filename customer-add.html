<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>顧客追加 | COMFORT</title>

  <link
    rel="stylesheet"
    href="style.css?v=5"
  />

  <style>

    body {
      background: #f7f4f2;
    }

    .customerAddTopbar {
      min-height: 72px;
      padding: 10px 20px;
      background: #ffffff;
      border-bottom: 1px solid #eadfda;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .customerAddTopbarLeft {
      display: flex;
      justify-content: flex-start;
    }

    .customerAddTopbarCenter {
      display: flex;
      justify-content: center;
    }

    .customerAddTopbarRight {
      display: flex;
      justify-content: flex-end;
    }

    .customerAddLogo {
      max-width: 150px;
      max-height: 48px;
      object-fit: contain;
    }

    .customerAddBackBtn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 15px;
      border: 1px solid #d8c7c0;
      border-radius: 10px;
      background: #ffffff;
      color: #694f46;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .customerAddPage {
      width: min(900px, calc(100% - 32px));
      margin: 30px auto 60px;
    }

    .customerAddHero {
      margin-bottom: 20px;
      padding: 26px 28px;
      background: #ffffff;
      border: 1px solid #eadfda;
      border-radius: 18px;
    }

    .customerAddEyebrow {
      margin-bottom: 4px;
      color: #b17d72;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .customerAddTitle {
      margin: 0;
      color: #4e3b34;
      font-size: 28px;
    }

    .customerAddDescription {
      margin: 8px 0 0;
      color: #7b6b65;
      font-size: 14px;
      line-height: 1.7;
    }

    .customerAddCard {
      padding: 24px;
      background: #ffffff;
      border: 1px solid #eadfda;
      border-radius: 18px;
    }

    .customerAddGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .customerAddField {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .customerAddFieldFull {
      grid-column: 1 / -1;
    }

    .customerAddLabel {
      color: #59453d;
      font-size: 13px;
      font-weight: 700;
    }

    .customerAddInput,
    .customerAddSelect,
    .customerAddTextarea {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #d7c9c3;
      border-radius: 10px;
      background: #fffdfc;
      color: #40332e;
      font-size: 15px;
    }

    .customerAddInput,
    .customerAddSelect {
      min-height: 44px;
      padding: 0 12px;
    }

    .customerAddTextarea {
      min-height: 90px;
      padding: 10px 12px;
      resize: vertical;
    }

    .customerAddActions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .customerAddPrimaryBtn {
      min-height: 46px;
      padding: 0 20px;
      border: none;
      border-radius: 10px;
      background: #a85f6a;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .customerAddMessage {
      min-height: 22px;
      margin-top: 16px;
      color: #a34d4d;
      font-size: 13px;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {

      .customerAddTopbar {
        min-height: 62px;
        padding: 8px 10px;
        grid-template-columns: auto 1fr auto;
      }

      .customerAddLogo {
        max-width: 110px;
        max-height: 38px;
      }

      .customerAddBackBtn {
        width: 42px;
        min-width: 42px;
        padding: 0;
        font-size: 0;
      }

      .customerAddBackBtn::before {
        content: "←";
        font-size: 20px;
      }

      .customerAddPage {
        width: calc(100% - 20px);
        margin-top: 16px;
      }

      .customerAddHero {
        padding: 20px;
        border-radius: 14px;
      }

      .customerAddTitle {
        font-size: 23px;
      }

      .customerAddCard {
        padding: 18px;
      }

      .customerAddGrid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>

<body>

  <header class="customerAddTopbar">

    <div class="customerAddTopbarLeft">
      <a
        href="customers.html"
        class="customerAddBackBtn"
      >
        ← 顧客管理へ戻る
      </a>
    </div>

    <div class="customerAddTopbarCenter">
      <img
        class="customerAddLogo"
        src="logo.png"
        alt="Hair & Make COMFORT"
      />
    </div>

    <div class="customerAddTopbarRight">

      <button
        id="logoutBtn"
        class="btn hidden"
        type="button"
      >
        ログアウト
      </button>

    </div>

  </header>

  <main
    id="customerAddApp"
    class="customerAddPage hidden"
  >

    <section class="customerAddHero">

      <div class="customerAddEyebrow">
        CUSTOMER REGISTRATION
      </div>

      <h1 class="customerAddTitle">
        顧客を追加
      </h1>

      <p class="customerAddDescription">
        新規のお客様・既存のお客様どちらも登録できます。
      </p>

    </section>

    <section class="customerAddCard">

      <div class="customerAddGrid">

        <label class="customerAddField">
          <span class="customerAddLabel">
            顧客区分
          </span>

          <select
            id="customerTypeSelect"
            class="customerAddSelect"
          >
            <option value="repeat">
              既存
            </option>

            <option value="new">
              新規
            </option>
          </select>
        </label>

        <label class="customerAddField">
          <span class="customerAddLabel">
            お名前
          </span>

          <input
            id="customerNameInput"
            class="customerAddInput"
            type="text"
            placeholder="例：山田 花子"
          />
        </label>

        <label class="customerAddField">
          <span class="customerAddLabel">
            フリガナ
          </span>

          <input
            id="customerNameKanaInput"
            class="customerAddInput"
            type="text"
            placeholder="例：ヤマダ ハナコ"
          />
        </label>

        <label class="customerAddField">
          <span class="customerAddLabel">
            電話番号
          </span>

          <input
            id="customerPhoneInput"
            class="customerAddInput"
            type="tel"
            placeholder="例：09012345678"
          />
        </label>

        <label class="customerAddField">
          <span class="customerAddLabel">
            誕生月
          </span>

          <select
            id="customerBirthMonthSelect"
            class="customerAddSelect"
          >
            <option value="">
              未登録
            </option>

            <option value="1">1月</option>
            <option value="2">2月</option>
            <option value="3">3月</option>
            <option value="4">4月</option>
            <option value="5">5月</option>
            <option value="6">6月</option>
            <option value="7">7月</option>
            <option value="8">8月</option>
            <option value="9">9月</option>
            <option value="10">10月</option>
            <option value="11">11月</option>
            <option value="12">12月</option>
          </select>
        </label>

        <label class="customerAddField">
          <span class="customerAddLabel">
            カルテ番号
          </span>

          <input
            id="customerChartNumberInput"
            class="customerAddInput"
            type="text"
            placeholder="例：1234"
          />
        </label>

        <label class="customerAddField">
          <span class="customerAddLabel">
            主担当
          </span>

          <select
            id="customerStaffSelect"
            class="customerAddSelect"
          >
            <option value="">
              未設定
            </option>

            <option value="kitamura">
              北村
            </option>

            <option value="yamazaki">
              山崎
            </option>

            <option value="takeuchi">
              竹内
            </option>
          </select>
        </label>

        <label class="customerAddField customerAddFieldFull">
          <span class="customerAddLabel">
            メモ
          </span>

          <textarea
            id="customerNoteInput"
            class="customerAddTextarea"
            placeholder="必要な情報があれば入力"
          ></textarea>
        </label>

      </div>

      <div
        id="customerAddMessage"
        class="customerAddMessage"
      ></div>

      <div class="customerAddActions">

        <a
          href="customers.html"
          class="customerAddBackBtn"
        >
          キャンセル
        </a>

        <button
          id="saveCustomerBtn"
          class="customerAddPrimaryBtn"
          type="button"
        >
          顧客を登録
        </button>

      </div>

    </section>

  </main>

  <div
    id="customerAddAccessDenied"
    class="authScreen hidden"
  >

    <div class="authCard">

      <div class="authTitle">
        顧客を追加
      </div>

      <div class="authSub">
        このページを利用する権限がありません。
      </div>

      <a
        href="customers.html"
        class="customerAddBackBtn"
      >
        ← 顧客管理へ戻る
      </a>

    </div>

  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="config.js"></script>
  <script src="customer-add.js"></script>

</body>

</html>
